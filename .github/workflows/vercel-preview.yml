name: Vercel Preview Deploy

on:
  pull_request:
    branches:
      - feature/spec-kit

jobs:
  preview-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Vercel Pull
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel Build
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel Deploy (Preview)
        id: vercel_deploy
        run: |
          DEPLOYMENT_URL=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

      - name: Preview Summary
        run: |
          echo "Vercel preview deploy finished." >> $GITHUB_STEP_SUMMARY
          echo "Preview URL: ${{ steps.vercel_deploy.outputs.deployment_url }}" >> $GITHUB_STEP_SUMMARY
